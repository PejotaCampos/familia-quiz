# Publishes the Blazor WebAssembly client to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/FamiliaQuiz.Client/**"
      - "src/FamiliaQuiz.Shared/**"
      - ".github/workflows/deploy-client.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish client
        run: dotnet publish src/FamiliaQuiz.Client/FamiliaQuiz.Client.csproj -c Release -o publish

      - name: Prepare for GitHub Pages
        run: |
          # Without this, Jekyll hides folders starting with "_" (like _framework).
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
